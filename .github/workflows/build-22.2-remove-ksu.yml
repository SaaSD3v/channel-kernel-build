name: Build Channel Kernel 22.2 (REMOVE-KSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl jq bc bison flex libssl-dev make libncurses-dev zip python3 device-tree-compiler

      - name: Clone kernel source
        run: git clone --depth=1 -b lineage-22.2 https://github.com/SaaSD3v/android_kernel_motorola_sdm632.git kernel

      - name: Disable Android paranoid network
        run: |
          cd kernel
          sed -i 's/^CONFIG_ANDROID_PARANOID_NETWORK=y$/# CONFIG_ANDROID_PARANOID_NETWORK is not set/' arch/arm64/configs/channel_defconfig

      - name: Download AOSP Clang clang-r536225
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-release/clang-r536225.tar.gz
          mkdir -p toolchains/clang-host-linux-x86
          tar -xzf clang-r536225.tar.gz -C toolchains/clang-host-linux-x86
          echo "CLANG_BIN=${PWD}/toolchains/clang-host-linux-x86/bin" >> $GITHUB_ENV

      - name: Download GCC 4.9 AArch64
        run: |
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchains/gcc-aarch64-4.9
          echo "GCC64_BIN=${PWD}/toolchains/gcc-aarch64-4.9/bin" >> $GITHUB_ENV

      - name: Download GCC 4.9 ARM32
        run: |
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchains/arm-linux-androideabi-4.9
          echo "GCC32_BIN=${PWD}/toolchains/arm-linux-androideabi-4.9/bin" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PWD/kernel/scripts:$PATH"
          make -C kernel O=$PWD/build ARCH=arm64 CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 channel_defconfig

      - name: Build kernel
        run: |
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PWD/kernel/scripts:$PATH"
          make -C kernel O=$PWD/build ARCH=arm64 CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 DTC=/usr/bin/dtc -j$(nproc) Image.gz-dtb

      - name: Package with AnyKernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp build/arch/arm64/boot/Image.gz-dtb anykernel/
          cp anykernel.sh anykernel/
          cd anykernel
          zip -r9 ../channel-kernel-22.2-remove-ksu.zip * -x '*.git*'

      - name: Upload to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          SERVER=$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          RESPONSE=$(curl -fsSL -X POST "https://${SERVER}.gofile.io/contents/uploadfile" \
            -H "Authorization: Bearer ${GOFILE_TOKEN}" \
            -F "file=@channel-kernel-22.2-remove-ksu.zip")
          echo "$RESPONSE" | jq .
          DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
          test -n "$DOWNLOAD_PAGE" && test "$DOWNLOAD_PAGE" != "null"
          echo "GoFile link: $DOWNLOAD_PAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: channel-kernel-22.2-remove-ksu
          path: channel-kernel-22.2-remove-ksu.zip
