      - name: Build Image.gz-dtb
        env:
          KBUILD_BUILD_USER: nobody
          KBUILD_BUILD_HOST: android-build
          KBUILD_BUILD_TIMESTAMP: Thu Dec 17 04:30:48 PST 2020
          KBUILD_BUILD_VERSION: "1"
        run: |
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"

          make -C kernel \
            O="$GITHUB_WORKSPACE/build" \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            -j"$(nproc)" \
            Image.gz-dtb

          test -s build/arch/arm64/boot/Image.gz-dtb
          sha256sum build/arch/arm64/boot/Image.gz-dtb | tee kernel.sha256

          INITRAMFS=$(find build/usr -maxdepth 1 -type f -name 'initramfs_data.cpio*' | head -n1)
          test -n "$INITRAMFS"
          case "$INITRAMFS" in
            *.lzma) ;;
            *) echo "Expected LZMA internal initramfs, got: $INITRAMFS"; exit 1 ;;
          esac
          echo "Kernel internal initramfs: $INITRAMFS"
          python3 <<'PY'
          from pathlib import Path
          import glob

          paths = glob.glob("build/usr/initramfs_data.cpio*.lzma")
          if len(paths) != 1:
              raise SystemExit(f"expected one LZMA initramfs, found {paths}")
          b = Path(paths[0]).read_bytes()
          if len(b) < 13:
              raise SystemExit("internal initramfs LZMA is too small")
          props = b[:5]
          expected = bytes.fromhex("5d00008000")
          if props != expected:
              raise SystemExit(
                  f"unexpected LZMA props: {props.hex()} != {expected.hex()}"
              )
          print("Internal initramfs LZMA props:", props.hex())
          PY
          case "$INITRAMFS" in
            *.gz) gzip -dc "$INITRAMFS" > /tmp/kernel-initramfs.cpio ;;
            *.xz) xz -dc "$INITRAMFS" > /tmp/kernel-initramfs.cpio ;;
            *.lzma)
              # gen_initramfs_list.sh emits a normal LZMA-Alone stream. Unlike
              # scripts/Makefile.lib cmd_lzma, this path does not append a
              # Kbuild 4-byte size trailer.
              xz --format=lzma -dc "$INITRAMFS" > /tmp/kernel-initramfs.cpio
              ;;
            *.cpio) cp "$INITRAMFS" /tmp/kernel-initramfs.cpio ;;
            *) echo "Unsupported internal initramfs format: $INITRAMFS"; exit 1 ;;
          esac

          cpio -it < /tmp/kernel-initramfs.cpio | tee kernel-initramfs-files.txt
          cpio -itv --numeric-uid-gid < /tmp/kernel-initramfs.cpio | tee kernel-initramfs-files-detailed.txt
          if grep -Ev '^[^ ]+[[:space:]]+[0-9]+[[:space:]]+0[[:space:]]+0[[:space:]]' kernel-initramfs-files-detailed.txt | grep -q .; then
            echo "Internal initramfs contains non-root ownership"
            exit 1
          fi
          for path in \
            sbin/rctools sbin/rctools-net sbin/busybox.ds sbin/iptables.ds sbin/iptables sbin/iptables-save sbin/iptables-restore \
            sbin/wpa_supplicant.ds sbin/hostapd.ds sbin/iw.ds sbin/wpa_cli.ds \
            sbin/wpa_passphrase.ds sbin/wifi-udhcpc.script sbin/wcnss-recovery sbin/recovery-time-sync \
            sbin/rctools-gpu sbin/libsync.so sbin/rctools-gpu-probe.so \
            sbin/rctools-opencl-probe.so sbin/rctools-gralloc-probe.so \
            sbin/android.hardware.graphics.common@1.0.so sbin/android.hardware.graphics.common@1.1.so \
            sbin/virgl/virgl_test_server sbin/virgl/lib/librctools-memfd-compat.so \
            sbin/virgl/lib/libvirglrenderer.so.1 sbin/virgl/lib/libepoxy.so.0 \
            sbin/virgl/lib/libEGL.so sbin/virgl/lib/libEGL.so.1 \
            sbin/virgl/lib/libGLESv2.so sbin/virgl/lib/libGLESv2.so.2 \
            sbin/ds-recovery-check lib/firmware/wlan/prima/WCNSS_qcom_cfg.ini
          do
            grep -Fxq "$path" kernel-initramfs-files.txt || {
              echo "Missing from kernel internal initramfs: $path"
              exit 1
            }
          done
          if grep -Fxq 'sbin/wifi' kernel-initramfs-files.txt; then
            echo "Legacy /sbin/wifi unexpectedly remains in kernel internal initramfs"
            exit 1
          fi

      - name: Replace only kernel in TWRP base image
        run: |
          python3 <<'PY'
          from pathlib import Path
          import struct

          BASE = Path("twrp-base.img")
          NEW_KERNEL = Path("build/arch/arm64/boot/Image.gz-dtb")
          OUTPUT = Path("${{ env.OUTPUT_IMG }}")

          base = BASE.read_bytes()
          new_kernel = NEW_KERNEL.read_bytes()

          if base[:8] != b"ANDROID!":
              raise SystemExit("Base TWRP image is not an Android boot image")

          kernel_size = struct.unpack_from("<I", base, 8)[0]
          kernel_addr = struct.unpack_from("<I", base, 12)[0]
          ramdisk_size = struct.unpack_from("<I", base, 16)[0]
          ramdisk_addr = struct.unpack_from("<I", base, 20)[0]
          second_size = struct.unpack_from("<I", base, 24)[0]
          page_size = struct.unpack_from("<I", base, 36)[0]
          header_version = struct.unpack_from("<I", base, 40)[0]

          if header_version != 1:
              raise SystemExit(f"Expected boot header v1, got v{header_version}")

          recovery_dtbo_size = struct.unpack_from("<I", base, 1632)[0]
          recovery_dtbo_offset = struct.unpack_from("<Q", base, 1636)[0]
          header_size = struct.unpack_from("<I", base, 1644)[0]

          if header_size != 1648:
              raise SystemExit(f"Unexpected boot header size: {header_size}")

          def align(value, alignment):
              return (value + alignment - 1) // alignment * alignment

          old_kernel_offset = page_size
          old_ramdisk_offset = align(old_kernel_offset + kernel_size, page_size)
          old_second_offset = align(old_ramdisk_offset + ramdisk_size, page_size)
          expected_recovery_offset = align(old_second_offset + second_size, page_size)

          if recovery_dtbo_size and recovery_dtbo_offset != expected_recovery_offset:
              raise SystemExit(
                  f"Unexpected recovery_dtbo offset: header={recovery_dtbo_offset}, "
                  f"calculated={expected_recovery_offset}"
              )

          old_kernel = base[old_kernel_offset:old_kernel_offset + kernel_size]
          ramdisk = base[old_ramdisk_offset:old_ramdisk_offset + ramdisk_size]
          second = base[old_second_offset:old_second_offset + second_size]
          recovery_dtbo = base[
              recovery_dtbo_offset:recovery_dtbo_offset + recovery_dtbo_size
          ]
          tail = base[recovery_dtbo_offset + recovery_dtbo_size:]

          for name, padding in (
              ("kernel", base[old_kernel_offset + kernel_size:old_ramdisk_offset]),
              ("ramdisk", base[old_ramdisk_offset + ramdisk_size:old_second_offset]),
              ("second", base[old_second_offset + second_size:expected_recovery_offset]),
          ):
              if any(padding):
                  raise SystemExit(f"Non-zero {name} padding in base image")

          def build(kernel):
              header = bytearray(base[:page_size])
              struct.pack_into("<I", header, 8, len(kernel))

              new_ramdisk_offset = align(page_size + len(kernel), page_size)
              new_second_offset = align(new_ramdisk_offset + ramdisk_size, page_size)
              new_recovery_offset = align(new_second_offset + second_size, page_size)

              if recovery_dtbo_size:
                  struct.pack_into("<Q", header, 1636, new_recovery_offset)

              out = bytearray(header)
              out += kernel
              out += bytes(new_ramdisk_offset - len(out))
              out += ramdisk
              out += bytes(new_second_offset - len(out))
              out += second
              out += bytes(new_recovery_offset - len(out))
              out += recovery_dtbo
              out += tail
              return bytes(out)

          clone = build(old_kernel)
          if clone != base:
              raise SystemExit("Base-image reconstruction check failed")

          kernel_window = ramdisk_addr - kernel_addr
          if kernel_window <= 0:
              raise SystemExit(
                  f"Invalid kernel/ramdisk load addresses: "
                  f"kernel=0x{kernel_addr:x} ramdisk=0x{ramdisk_addr:x}"
              )
          if len(new_kernel) >= kernel_window:
              raise SystemExit(
                  f"Kernel image overlaps ramdisk load address: "
                  f"kernel={len(new_kernel)} window={kernel_window}"
              )
          print(
              f"Kernel load window : {kernel_window} bytes; "
              f"new kernel {len(new_kernel)} bytes; "
              f"headroom {kernel_window - len(new_kernel)} bytes"
          )

          output = build(new_kernel)

          if len(output) > 33554432:
              raise SystemExit(
                  f"Output is {len(output)} bytes, larger than the 32 MiB boot partition"
              )

          OUTPUT.write_bytes(output)

          print(f"Base kernel size : {kernel_size}")
          print(f"New kernel size  : {len(new_kernel)}")
          print(f"Ramdisk size     : {ramdisk_size}")
          print(f"Recovery DTBO    : {recovery_dtbo_size}")
          print(f"Output size      : {len(output)}")
          print(f"Output           : {OUTPUT}")
          PY

      - name: Remove TWRP service and finalize RCTools ramdisk
        run: |
          set -euo pipefail
          python3 scripts/disable-twrp-service.py "$OUTPUT_IMG" "$OUTPUT_IMG.rctools"
          mv "$OUTPUT_IMG.rctools" "$OUTPUT_IMG"

      - name: Verify final RCTools image
        run: |
          test "$(head -c 8 "$OUTPUT_IMG")" = "ANDROID!"
          test "$(stat -c%s "$OUTPUT_IMG")" -le 33554432

          python3 <<'PY'
          from pathlib import Path
          import struct

          def align(v, n):
              return (v + n - 1) // n * n

          def split(path):
              d = Path(path).read_bytes()
              k = struct.unpack_from("<I", d, 8)[0]
              r = struct.unpack_from("<I", d, 16)[0]
              s = struct.unpack_from("<I", d, 24)[0]
              p = struct.unpack_from("<I", d, 36)[0]
              dz = struct.unpack_from("<I", d, 1632)[0]
              do = struct.unpack_from("<Q", d, 1636)[0]
              ko = p
              ro = align(ko + k, p)
              so = align(ro + r, p)
              return {
                  "data": d,
                  "kernel": d[ko:ko+k],
                  "ramdisk": d[ro:ro+r],
                  "second": d[so:so+s],
                  "dtbo": d[do:do+dz],
                  "tail": d[do+dz:],
                  "header": d[:p],
              }

          base = split("twrp-base.img")
          final = split("${{ env.OUTPUT_IMG }}")

          if final["ramdisk"] == base["ramdisk"]:
              raise SystemExit("external ramdisk did not receive the RCTools service-removal patch")
          if final["second"] != base["second"]:
              raise SystemExit("boot second stage changed")
          if final["dtbo"] != base["dtbo"]:
              raise SystemExit("recovery DTBO changed")
          if final["tail"] != base["tail"]:
              raise SystemExit("post-DTBO tail changed")

          bh = bytearray(base["header"])
          fh = bytearray(final["header"])
          for off, size in ((8, 4), (16, 4), (1636, 8)):
              bh[off:off+size] = bytes(size)
              fh[off:off+size] = bytes(size)
          if bh != fh:
              raise SystemExit("unexpected static boot header change")

          print("External boot structures verified:")
          print("- TeamWin ramdisk byte-for-byte identical")
          print("- second stage byte-for-byte identical")
          print("- recovery DTBO byte-for-byte identical")
          print("- post-DTBO tail byte-for-byte identical")
          print("- only kernel size/recovery offset fields changed as required")
          PY

          sha256sum "$OUTPUT_IMG" | tee twrp-droidspaces.sha256

          {
            echo "### Channel TWRP DroidSpaces + kernel-initramfs Wi-Fi/hotspot build"
            echo
            echo "- TWRP base: 3.5.2_10-0 official channel image"
            echo "- TWRP kernel source: TeamWin/android_kernel_motorola_sdm632 @ $TWRP_KERNEL_REF (twrp-10.0)"
            echo "- Kernel config: extracted byte-for-byte from official TWRP 3.5.2_10-0 kernel"
            echo "- DroidSpaces config commits: ee9637adaa0c38f9105feb4902531d608298df81, e310252413ffb052e86092d32f7f8b4fabd5eae2, f09c342d80aaa93eb852320568b9313d2768386b"
            echo "- DroidSpaces source fix: c6f0507da463205a4d6d9ca4fb1130218530feb3"
            echo "- KernelSU/ReSukiSU: not added"
            echo "- Kernel profile: channel-cli-minimal-display-touch-camera-off"
            echo "- Physical framebuffer/touch/camera: disabled"
            echo "- KGSL/Adreno + ION/sync_file + VIDC + ADB + Wi-Fi + DroidSpaces: preserved"
            echo "- Headless GPU userspace: source-built libsync + EGL/GLES2 pbuffer probe embedded"
            echo "- GPU runtime model: recovery Bionic + active vendor Qualcomm blobs; Android system partition not required"
            echo "- Recovery Wi-Fi payload: embedded in the kernel internal initramfs"
            echo "- External TeamWin ramdisk: patched only to remove the TWRP recovery service"
            echo "- /system/bin/recovery: retained for manual compatibility"
            echo "- RCTools: /sbin/rctools with direct A/B mounts, Wi-Fi, hotspot, DroidSpaces and time tools"
            echo
            echo "SHA-256:"
            cat twrp-droidspaces.sha256
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: channel-rctools-cli-minimal-gpu
          path: |
            ${{ env.OUTPUT_IMG }}
            build/arch/arm64/boot/Image.gz-dtb
            droidspaces.fragment
            droidspaces-final-config.txt
            recovery-cli-minimal.fragment
            cli-minimal-profile.txt
            official-twrp.config
            official-twrp-after-olddefconfig.config
            official-config-source-diff.txt
            kernel.sha256
            kernel-initramfs-files.txt
            kernel-initramfs-files-detailed.txt
            wifi-initramfs-ownership.txt
            twrp-droidspaces.sha256
            recovery-wifi/out/SHA256SUMS
            recovery-wifi/rctools
            recovery-wifi/rctools-net
            recovery-wifi/rctools-gpu
            recovery-wifi/build-gpu-userspace.sh
            recovery-wifi/gpu/libsync_min.c
            recovery-wifi/gpu/egl_probe.c
            recovery-wifi/gpu/opencl_probe.c
            recovery-wifi/gpu/gralloc_probe.c
            recovery-wifi/gpu/link_stubs.c
            recovery-wifi/out/libsync.so
            recovery-wifi/out/rctools-gpu-probe.so
            recovery-wifi/out/rctools-opencl-probe.so
            recovery-wifi/out/rctools-gralloc-probe.so
            recovery-wifi/out/android.hardware.graphics.common@1.0.so
            recovery-wifi/out/android.hardware.graphics.common@1.1.so
            scripts/disable-twrp-service.py
            recovery-wifi/hostapd.config
            recovery-wifi/wifi-udhcpc.script
            recovery-wifi/WCNSS_qcom_cfg.ini
            recovery-wifi/devices/channel/device.conf
            recovery-wifi/devices/README.md
          if-no-files-found: error


      - name: Upload build files individually to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GOFILE_TOKEN:-}" ]; then
            echo "::warning::GOFILE_TOKEN repository secret is not configured; skipping GoFile upload."
            exit 0
          fi

          rm -rf gofile-files
          mkdir -p gofile-files
          files=(
            "$OUTPUT_IMG"
            "build/arch/arm64/boot/Image.gz-dtb"
            "droidspaces.fragment"
            "droidspaces-final-config.txt"
            "recovery-cli-minimal.fragment"
            "cli-minimal-profile.txt"
            "official-twrp.config"
            "official-twrp-after-olddefconfig.config"
            "official-config-source-diff.txt"
            "kernel.sha256"
            "kernel-initramfs-files.txt"
            "kernel-initramfs-files-detailed.txt"
            "wifi-initramfs-ownership.txt"
            "twrp-droidspaces.sha256"
            "recovery-wifi/out/SHA256SUMS"
            "recovery-wifi/rctools"
            "recovery-wifi/rctools-net"
            "recovery-wifi/rctools-gpu"
            "recovery-wifi/build-gpu-userspace.sh"
            "recovery-wifi/gpu/libsync_min.c"
            "recovery-wifi/gpu/egl_probe.c"
            "recovery-wifi/gpu/opencl_probe.c"
            "recovery-wifi/gpu/gralloc_probe.c"
            "recovery-wifi/gpu/link_stubs.c"
            "recovery-wifi/out/libsync.so"
            "recovery-wifi/out/rctools-gpu-probe.so"
            "recovery-wifi/out/rctools-opencl-probe.so"
            "recovery-wifi/out/rctools-gralloc-probe.so"
            "recovery-wifi/out/android.hardware.graphics.common@1.0.so"
            "recovery-wifi/out/android.hardware.graphics.common@1.1.so"
            "scripts/disable-twrp-service.py"
            "recovery-wifi/hostapd.config"
            "recovery-wifi/wifi-udhcpc.script"
            "recovery-wifi/WCNSS_qcom_cfg.ini"
            "recovery-wifi/devices/channel/device.conf"
            "recovery-wifi/devices/README.md"
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "::error::Missing GoFile artifact: $file"; exit 1; }
            base="$(basename "$file")"
            if [ -e "gofile-files/$base" ]; then
              echo "::error::Duplicate artifact basename: $base"
              exit 1
            fi
            cp "$file" "gofile-files/$base"
          done

          server_json="$(curl --silent --show-error --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors https://api.gofile.io/servers)"
          upload_server="$(printf '%s' "$server_json" | python3 -c 'import json,sys; j=json.load(sys.stdin); s=(j.get("data") or {}).get("servers") or []; print((s[0] or {}).get("name","") if s else "")')"
          test -n "$upload_server" || { echo "::error::GoFile returned no upload server"; exit 1; }
          upload_url="https://$upload_server.gofile.io/contents/uploadfile"

          folder_id=""
          folder_page=""
          uploaded=0
          summary="$RUNNER_TEMP/gofile-build-files.md"
          : > "$summary"

          while IFS= read -r -d '' file; do
            args=(--silent --show-error --fail-with-body --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 1200
              -H "Authorization: Bearer $GOFILE_TOKEN"
              -F "file=@$file")
            if [ -n "$folder_id" ]; then
              args+=(-F "folderId=$folder_id")
            fi
            response="$(curl "${args[@]}" "$upload_url")"
            mapfile -t meta < <(printf '%s' "$response" | python3 -c 'import json,sys; j=json.load(sys.stdin); d=j.get("data") or {}; print(j.get("status","")); print(d.get("parentFolder") or d.get("folderId") or ""); print(d.get("downloadPage","")); print(d.get("parentFolderCode") or d.get("folderCode") or "")')
            status="${meta[0]:-}"
            parent="${meta[1]:-}"
            page="${meta[2]:-}"
            parent_code="${meta[3]:-}"
            if [ "$status" != "ok" ]; then
              echo "::error::GoFile rejected $(basename "$file")"
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if [ -z "$folder_id" ]; then folder_id="$parent"; fi
            if [ -z "$folder_page" ] && [ -n "$parent_code" ]; then folder_page="https://gofile.io/d/$parent_code"; fi
            name="$(basename "$file")"
            if [ -n "$page" ]; then
              printf -- '- [%s](%s)\n' "$name" "$page" >> "$summary"
            else
              printf -- '- %s\n' "$name" >> "$summary"
            fi
            uploaded=$((uploaded + 1))
          done < <(find gofile-files -type f -print0 | sort -z)

          {
            echo "### GoFile — $uploaded individual build files"
            [ -z "$folder_page" ] || echo "Folder: $folder_page"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
