name: Build Channel RCTools CLI Minimal GPU

run-name: Channel RCTools CLI Minimal • Headless GPU + DroidSpaces + Wi-Fi

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-cli-minimal-gpu-headless

permissions:
  contents: read

env:
  DEVICE: channel
  TWRP_KERNEL_REPO: https://github.com/TeamWin/android_kernel_motorola_sdm632.git
  TWRP_KERNEL_REF: 0fba78718c25ef55a211dd7608cb255a226dd8bf
  TWRP_BASE_URL: https://dl.twrp.me/channel/twrp-3.5.2_10-0-channel.img
  TWRP_BASE_SHA256: 486c3e11250c1233112372129c796b55e0cd5d0f4ac605906d90b0f9b574056c
  OUTPUT_IMG: channel-rctools-cli-minimal-gpu.img

jobs:
  build:
    name: Channel RCTools minimal recovery
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate RCTools networking sources
        run: |
          set -euo pipefail
          /bin/sh -n recovery-wifi/rctools-net
          /bin/sh -n recovery-wifi/rctools
          /bin/sh -n recovery-wifi/rctools-gpu
          bash -n recovery-wifi/build-userspace.sh
          bash -n recovery-wifi/build-gpu-userspace.sh
          test -f recovery-wifi/gpu/libsync_min.c
          test -f recovery-wifi/gpu/egl_probe.c
          test -f recovery-wifi/gpu/opencl_probe.c
          test -f recovery-wifi/gpu/gralloc_probe.c
          test -f recovery-wifi/gpu/link_stubs.c
          grep -Fq 'GPU=/sbin/rctools-gpu' recovery-wifi/rctools
          grep -Fq 'rctools gpu probe' recovery-wifi/rctools
          grep -Fq 'PASS GPU_RENDER_OK' recovery-wifi/gpu/egl_probe.c
          grep -Fq 'PASS GPU_OPENCL_OK' recovery-wifi/gpu/opencl_probe.c
          grep -Fq 'PASS GRALLOC_HAL_OK' recovery-wifi/gpu/gralloc_probe.c
          grep -Fq 'rctools gpu opencl' recovery-wifi/rctools-gpu
          grep -Fq 'rctools gpu gralloc' recovery-wifi/rctools-gpu
          grep -Fq 'rctools gpu start' recovery-wifi/rctools-gpu
          grep -Fq 'rctools gpu stop' recovery-wifi/rctools-gpu
          python3 -m py_compile scripts/disable-twrp-service.py
          grep -Fq 'rctools mount a system|vendor|oem|all' recovery-wifi/rctools
          grep -Fq 'rctools mount b system|vendor|oem|all' recovery-wifi/rctools
          ! grep -Fq 'all-slots' recovery-wifi/rctools
          grep -Fq 'rctools hotspot repeater-5g' recovery-wifi/rctools
          grep -Fq 'rctools block NAME' recovery-wifi/rctools
          grep -Fq 'NET=/sbin/rctools-net' recovery-wifi/rctools
          ! grep -Fq 'rctools-net-udhcpc.script' .github/workflows/build-twrp-cli-minimal.yml
          ! grep -Fq 'WIFI=/sbin/wifi' recovery-wifi/rctools
          ! grep -Fq "cat <<'EOF'" recovery-wifi/rctools
          grep -Fq '/sbin/rctools mount data rw' recovery-wifi/rctools-net
          ! grep -Fq '/sbin/rctools mount data none rw' recovery-wifi/rctools-net
          ! grep -Fq "'  wifi " recovery-wifi/rctools-net
          ! grep -Fq 'usage: wifi ' recovery-wifi/rctools-net
          ! grep -Fq 'Use: wifi ' recovery-wifi/rctools-net
          ! grep -Fq 'Run: wifi ' recovery-wifi/rctools-net
          test -f "recovery-wifi/devices/$DEVICE/device.conf"
          test -f recovery-cli-minimal.fragment
          test -f scripts/apply-cli-minimal-kernel.sh
          bash -n scripts/apply-cli-minimal-kernel.sh
          ! grep -qx 'CONFIG_AP=y' recovery-wifi/wpa_supplicant.config
          grep -qx 'CONFIG_DRIVER_NL80211=y' recovery-wifi/hostapd.config
          grep -qx 'CONFIG_LIBNL32=y' recovery-wifi/hostapd.config
          grep -q 'CONFIG_UDHCPD' recovery-wifi/build-userspace.sh
          grep -q 'IPTABLES_COMMIT=' recovery-wifi/build-userspace.sh
          grep -q 'xtables-multi' recovery-wifi/build-userspace.sh
          grep -q 'CONFIG_NTPD' recovery-wifi/build-userspace.sh
          grep -q 'CONFIG_TIMEOUT' recovery-wifi/build-userspace.sh
          grep -q 'recovery-time-sync' recovery-wifi/rctools-net
          grep -q 'one-shot NTP sync' recovery-wifi/recovery-time-sync
          grep -q '^cmd_hotspot_create()' recovery-wifi/rctools-net
          grep -q '^cmd_hotspot_config()' recovery-wifi/rctools-net
          grep -q '^cmd_hotspot_start()' recovery-wifi/rctools-net
          grep -q '^cmd_hotspot_stop()' recovery-wifi/rctools-net
          grep -q '^cmd_hotspot_delete()' recovery-wifi/rctools-net
          grep -q '^cmd_hotspot_repeater()' recovery-wifi/rctools-net
          grep -q '^cmd_hotspot_repeater_2g()' recovery-wifi/rctools-net
          grep -q '^cmd_hotspot_repeater_5g()' recovery-wifi/rctools-net
          grep -Fq 'up|start) cmd_up ;;' recovery-wifi/rctools-net
          grep -Fq 'down|stop) cmd_down ;;' recovery-wifi/rctools-net
          grep -Fq 'repeater) cmd_hotspot_repeater "$@" ;;' recovery-wifi/rctools-net
          grep -Fq 'repeater-2g) cmd_hotspot_repeater_2g "$@" ;;' recovery-wifi/rctools-net
          grep -Fq 'repeater-5g) cmd_hotspot_repeater_5g "$@" ;;' recovery-wifi/rctools-net
          grep -Fq '"$BB" timeout 12 "$WPA"' recovery-wifi/rctools-net
          grep -Fq 'lease.env' recovery-wifi/rctools-net
          grep -Fq 'stop_child_bounded "$dhcp_pid"' recovery-wifi/rctools-net
          grep -Fq '"$BB" timeout "$SYNC_TIMEOUT" "$BB" sync' recovery-wifi/rctools-net
          grep -Fq 'WPA_CLI_TIMEOUT=${WIFI_WPA_CLI_TIMEOUT:-2}' recovery-wifi/rctools-net
          grep -Fq 'DATA_MOUNT_TIMEOUT=${WIFI_DATA_MOUNT_TIMEOUT:-8}' recovery-wifi/rctools-net
          grep -Fq 'MOUNT_TIMEOUT=${WIFI_MOUNT_TIMEOUT:-5}' recovery-wifi/rctools-net
          grep -Fq 'stage=persistence checking saved wlan profiles' recovery-wifi/rctools-net
          grep -Fq 'stage=supplicant starting' recovery-wifi/rctools-net
          grep -Fq 'stage=association waiting up to 25s' recovery-wifi/rctools-net
          grep -Fq 'stage=dhcp acquiring lease' recovery-wifi/rctools-net
          grep -Fq 'if [ "$#" -eq 0 ]; then' recovery-wifi/rctools-net
          if grep -Fq '"$WPACLI" -p' recovery-wifi/rctools-net; then
            echo "Direct unbounded wpa_cli invocation remains"
            exit 1
          fi
          if grep -Fq '"$IPTABLES" -' recovery-wifi/rctools-net; then
            echo "Direct unbounded iptables invocation remains"
            exit 1
          fi
          if grep -Fq 'twrp mount data' recovery-wifi/rctools-net; then
            echo "Unbounded twrp mount data invocation remains"
            exit 1
          fi
          grep -q '^cmd_ping()' recovery-wifi/rctools-net
          grep -Fq 'Static resolver fallback:' recovery-wifi/rctools-net
          grep -q 'CONFIG_NSLOOKUP' recovery-wifi/build-userspace.sh
          grep -qx 'IPTABLES=/sbin/iptables' recovery-wifi/rctools-net
          grep -Fq 'PERSIST_NETWORKS=$PERSIST_WLAN_DIR/networks' recovery-wifi/rctools-net
          grep -Fq 'PERSIST_HOTSPOT=$PERSIST_AP_DIR/hotspot.conf' recovery-wifi/rctools-net
          grep -Fq 'tmp="$PERSIST_AP_DIR/.hotspot.$$"' recovery-wifi/rctools-net
          grep -Fq 'Internet sharing/NAT is disabled in start-vif mode' recovery-wifi/rctools-net
          grep -Fq "hotspot_dns=" recovery-wifi/rctools-net
          grep -Fq "xtables state match" recovery-wifi/ds-recovery-check
          grep -Fq 'kernel xt match: $match' recovery-wifi/ds-recovery-check
          grep -Fq 'HOTSPOT_FORWARD_CHAIN=CHANNEL_HOTSPOT_FWD' recovery-wifi/rctools-net
          grep -Fq 'HOTSPOT_NAT_CHAIN=CHANNEL_HOTSPOT_NAT' recovery-wifi/rctools-net
          grep -q '192\.168\.43\.1/24' recovery-wifi/rctools-net

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget ca-certificates \
            bc bison flex libssl-dev libelf-dev make libncurses-dev \
            python3 xz-utils cpio zip file autoconf automake libtool pkg-config \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static

      - name: Clone exact TWRP channel kernel base
        run: |
          git init kernel
          git -C kernel remote add origin "$TWRP_KERNEL_REPO"
          git -C kernel fetch --depth=1 origin "$TWRP_KERNEL_REF"
          git -C kernel checkout --detach FETCH_HEAD

          echo "TWRP kernel base:" >> "$GITHUB_STEP_SUMMARY"
          git -C kernel log -1 --format='- %H %s' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply CLI-minimal kernel source adaptations
        run: |
          set -euo pipefail
          chmod +x scripts/apply-cli-minimal-kernel.sh
          scripts/apply-cli-minimal-kernel.sh kernel

      - name: Download exact TWRP 3.5.2_10-0 base image
        run: |
          set -euo pipefail

          NAME="twrp-3.5.2_10-0-channel.img"
          PAGE="https://dl.twrp.me/channel/$NAME.html"

          PAGE_HTML=$(curl -fLsS --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 GitHub-Actions Channel-TWRP-DroidSpaces' "$PAGE")

          FILE_HREF=$(printf '%s' "$PAGE_HTML" \
            | grep -oE 'href="[^"]*twrp-3\\.5\\.2_10-0-channel\\.img"' \
            | head -n1 | cut -d'"' -f2 || true)

          case "$FILE_HREF" in
            http://*|https://*) FILE_URL="$FILE_HREF" ;;
            /*) FILE_URL="https://dl.twrp.me$FILE_HREF" ;;
            "") FILE_URL="" ;;
            *) FILE_URL="https://dl.twrp.me/channel/$FILE_HREF" ;;
          esac

          ok=0
          for URL in \
            "https://eu.dl.twrp.me/channel/$NAME" \
            "$FILE_URL" \
            "https://dl.twrp.me/channel/$NAME?download=1"
          do
            [ -n "$URL" ] || continue
            rm -f twrp-base.img.part
            if curl -fL --retry 3 --retry-delay 2 --connect-timeout 30 \
              -A 'Mozilla/5.0 GitHub-Actions Channel-TWRP-DroidSpaces' \
              -e "$PAGE" -o twrp-base.img.part "$URL"; then
              if [ "$(stat -c%s twrp-base.img.part)" -gt 20000000 ] && \
                 [ "$(head -c 8 twrp-base.img.part)" = "ANDROID!" ]; then
                mv twrp-base.img.part twrp-base.img
                ok=1
                break
              fi
            fi
          done

          [ "$ok" -eq 1 ]
          echo "$TWRP_BASE_SHA256  twrp-base.img" | sha256sum -c -

      - name: Extract exact official TWRP kernel config
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import struct

          base = Path("twrp-base.img").read_bytes()
          if base[:8] != b"ANDROID!":
              raise SystemExit("Not an Android boot image")

          kernel_size = struct.unpack_from("<I", base, 8)[0]
          page_size = struct.unpack_from("<I", base, 36)[0]
          kernel = base[page_size:page_size + kernel_size]

          if len(kernel) != kernel_size:
              raise SystemExit("Failed to extract complete official TWRP kernel")

          Path("official-twrp-Image.gz-dtb").write_bytes(kernel)
          print("Official kernel size:", kernel_size)
          PY

          chmod +x kernel/scripts/extract-ikconfig
          kernel/scripts/extract-ikconfig official-twrp-Image.gz-dtb > official-twrp.config

          test -s official-twrp.config
          echo "bb1430e6ceccb76c1f0a5d8633e10f8aa71933953cb1ee9cee29b1613c46b335  official-twrp.config" | sha256sum -c -

          grep -qx 'CONFIG_LOCALVERSION="-perf"' official-twrp.config
          grep -qx 'CONFIG_IKCONFIG=y' official-twrp.config
          grep -qx 'CONFIG_SCHED_CORE_CTL=y' official-twrp.config
          grep -qx 'CONFIG_RD_XZ=y' official-twrp.config
          grep -qx 'CONFIG_RD_LZO=y' official-twrp.config
          grep -qx 'CONFIG_CMA_AREAS=7' official-twrp.config
          grep -qx 'CONFIG_USB_ANDROID_USBNET=y' official-twrp.config

      - name: Apply DroidSpaces cgroup noprefix fix
        run: |
          # SaaSD3v/android_kernel_motorola_sdm632:
          # c6f0507da463205a4d6d9ca4fb1130218530feb3 - fix: cgroups noprefix
          curl -fL --retry 5 \
            "https://github.com/SaaSD3v/android_kernel_motorola_sdm632/commit/c6f0507da463205a4d6d9ca4fb1130218530feb3.patch" \
            -o /tmp/droidspaces-cgroup-noprefix.patch

          git -C kernel apply --check /tmp/droidspaces-cgroup-noprefix.patch
          git -C kernel apply /tmp/droidspaces-cgroup-noprefix.patch

      - name: Create DroidSpaces Kconfig fragment
        run: |
          # This fragment carries the configuration changes from:
          # ee9637adaa0c38f9105feb4902531d608298df81 - Kernel configurations for full DroidSpaces support
          # e310252413ffb052e86092d32f7f8b4fabd5eae2 - Firewall Support (UFW/Fail2ban) - Optional
          # f09c342d80aaa93eb852320568b9313d2768386b - disable CONFIG_ANDROID_PARANOID_NETWORK
          #
          # The source-code fix c6f0507da463205a4d6d9ca4fb1130218530feb3 is applied separately above.
          cat > droidspaces.fragment <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_MEMCG=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_VETH=y
          CONFIG_OVERLAY_FS=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF

          cat droidspaces.fragment

      - name: Validate and build static recovery Wi-Fi userspace
        run: |
          set -euo pipefail
          bash -n recovery-wifi/build-userspace.sh
          sh -n recovery-wifi/rctools-net
          sh -n recovery-wifi/wifi-udhcpc.script
          sh -n recovery-wifi/recovery-time-sync
          sh -n recovery-wifi/ds-recovery-check
          chmod +x recovery-wifi/build-userspace.sh
          DEVICE="$DEVICE" recovery-wifi/build-userspace.sh
          bash recovery-wifi/build-gpu-userspace.sh

          # Stage the exact Android/Bionic VirGL runtime validated on Channel.
          # Only classic VirGL/vtest pieces are kept; virgl_render_server/Venus
          # are intentionally excluded to save initramfs space.
          VIRGL_TAG="1.3.0-8148de0"
          VIRGL_URL="https://github.com/Container-On-Android/virglrenderer/releases/download/$VIRGL_TAG/android-aarch64-api30-virglrenderer.tar.gz"
          VIRGL_ARCHIVE="$RUNNER_TEMP/virglrenderer-android.tar.gz"
          VIRGL_EXTRACT="$RUNNER_TEMP/virglrenderer-android"
          VIRGL_OUT="$GITHUB_WORKSPACE/recovery-wifi/out/virgl"
          rm -rf "$VIRGL_EXTRACT" "$VIRGL_OUT"
          mkdir -p "$VIRGL_EXTRACT" "$VIRGL_OUT/bin" "$VIRGL_OUT/lib"

          curl -fL --retry 5 --retry-delay 2 "$VIRGL_URL" -o "$VIRGL_ARCHIVE"
          tar -xzf "$VIRGL_ARCHIVE" -C "$VIRGL_EXTRACT"

          virgl_server="$(find "$VIRGL_EXTRACT" -type f -name virgl_test_server -print -quit)"
          virgl_lib="$(find "$VIRGL_EXTRACT" -type f -name 'libvirglrenderer.so.*' -print | sort -V | tail -n1)"
          epoxy_lib="$(find "$VIRGL_EXTRACT" -type f -name 'libepoxy.so.*' -print | sort -V | tail -n1)"
          test -n "$virgl_server"
          test -n "$virgl_lib"
          test -n "$epoxy_lib"

          install -m 0755 "$virgl_server" "$VIRGL_OUT/bin/virgl_test_server"
          virgl_name="${virgl_lib##*/}"
          epoxy_name="${epoxy_lib##*/}"
          install -m 0644 "$virgl_lib" "$VIRGL_OUT/lib/$virgl_name"
          install -m 0644 "$epoxy_lib" "$VIRGL_OUT/lib/$epoxy_name"
          ln -s "$virgl_name" "$VIRGL_OUT/lib/libvirglrenderer.so.1"
          ln -s "$virgl_name" "$VIRGL_OUT/lib/libvirglrenderer.so"
          ln -s "$epoxy_name" "$VIRGL_OUT/lib/libepoxy.so.0"
          ln -s "$epoxy_name" "$VIRGL_OUT/lib/libepoxy.so"

          # Old recovery Bionic has syscall(2) but no libc memfd_create symbol.
          # Keep the shim freestanding and resolve syscall from loaded Bionic libc.
          cat > "$RUNNER_TEMP/rctools-memfd-compat.c" <<'EOF'
          extern long syscall(long number, ...);
          __attribute__((visibility("default")))
          int memfd_create(const char *name, unsigned int flags)
          {
              return (int) syscall(279L, name, flags);
          }
          EOF
          aarch64-linux-gnu-gcc -Os -fPIC -fno-stack-protector \
            -shared -nostdlib -Wl,--hash-style=both \
            -Wl,-soname,librctools-memfd-compat.so \
            "$RUNNER_TEMP/rctools-memfd-compat.c" \
            -o "$VIRGL_OUT/lib/librctools-memfd-compat.so"

          aarch64-linux-gnu-strip --strip-unneeded "$VIRGL_OUT/bin/virgl_test_server"
          aarch64-linux-gnu-strip --strip-unneeded "$VIRGL_OUT/lib/$virgl_name"
          aarch64-linux-gnu-strip --strip-unneeded "$VIRGL_OUT/lib/$epoxy_name"
          aarch64-linux-gnu-strip --strip-unneeded "$VIRGL_OUT/lib/librctools-memfd-compat.so"

          file "$VIRGL_OUT/bin/virgl_test_server" | grep -q 'ARM aarch64'
          aarch64-linux-gnu-readelf -l "$VIRGL_OUT/bin/virgl_test_server" | grep -Fq '/system/bin/linker64'
          aarch64-linux-gnu-readelf -d "$VIRGL_OUT/bin/virgl_test_server" | grep -Fq 'Shared library: [libvirglrenderer.so.1]'
          aarch64-linux-gnu-readelf -d "$VIRGL_OUT/lib/$virgl_name" | grep -Fq 'Shared library: [libepoxy.so.0]'
          aarch64-linux-gnu-readelf -Ws "$VIRGL_OUT/lib/$virgl_name" | grep -Eq 'UND[[:space:]]+memfd_create$'
          aarch64-linux-gnu-readelf -Ws "$VIRGL_OUT/lib/librctools-memfd-compat.so" | grep -Eq '[[:space:]]memfd_create$'
          aarch64-linux-gnu-readelf -Ws "$VIRGL_OUT/lib/librctools-memfd-compat.so" | grep -Eq 'UND[[:space:]]+syscall$'
          du -h "$VIRGL_OUT/bin/virgl_test_server" "$VIRGL_OUT/lib/$virgl_name" "$VIRGL_OUT/lib/$epoxy_name" "$VIRGL_OUT/lib/librctools-memfd-compat.so"

          test -x recovery-wifi/out/iptables.ds
          test -r recovery-wifi/out/libsync.so
          test -r recovery-wifi/out/rctools-gpu-probe.so
          test -r recovery-wifi/out/rctools-opencl-probe.so
          test -r recovery-wifi/out/rctools-gralloc-probe.so
          test -r recovery-wifi/out/android.hardware.graphics.common@1.0.so
          test -r recovery-wifi/out/android.hardware.graphics.common@1.1.so
          aarch64-linux-gnu-readelf -Ws recovery-wifi/out/libsync.so | grep -Eq '[[:space:]]sync_wait$'
          aarch64-linux-gnu-readelf -Ws recovery-wifi/out/libsync.so | grep -Eq '[[:space:]]sync_merge$'
          aarch64-linux-gnu-readelf -d recovery-wifi/out/rctools-gpu-probe.so | grep -Fq 'Shared library: [libEGL_adreno.so]'
          aarch64-linux-gnu-readelf -d recovery-wifi/out/rctools-gpu-probe.so | grep -Fq 'Shared library: [libGLESv2_adreno.so]'
          aarch64-linux-gnu-readelf -d recovery-wifi/out/rctools-opencl-probe.so | grep -Fq 'Shared library: [libOpenCL.so]'
          aarch64-linux-gnu-readelf -d recovery-wifi/out/rctools-gralloc-probe.so | grep -Fq 'Shared library: [libhardware.so]'
          file recovery-wifi/out/android.hardware.graphics.common@1.0.so | grep -q 'ARM aarch64'
          file recovery-wifi/out/android.hardware.graphics.common@1.1.so | grep -q 'ARM aarch64'
          file recovery-wifi/out/iptables.ds | tee iptables-file.txt
          grep -q 'ARM aarch64' iptables-file.txt
          grep -q 'statically linked' iptables-file.txt

          aarch64-linux-gnu-strings recovery-wifi/out/iptables.ds > iptables-strings.txt
          for token in iptables iptables-save iptables-restore DNAT MASQUERADE addrtype; do
            grep -Fq "$token" iptables-strings.txt || {
              echo "Static legacy iptables is missing built-in token/extension: $token"
              exit 1
            }
          done

          # Execute the final ARM64 multicall binaries under qemu-user. This
          # catches broken argv[0] dispatch, missing static extensions and
          # BusyBox applets that a config/string check alone would miss.
          QEMU="$(command -v qemu-aarch64-static)"
          test -x "$QEMU"
          SMOKE="$RUNNER_TEMP/ds-arm64-smoke"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE"
          cp recovery-wifi/out/iptables.ds "$SMOKE/iptables.ds"
          ln -s iptables.ds "$SMOKE/iptables"
          ln -s iptables.ds "$SMOKE/iptables-save"
          ln -s iptables.ds "$SMOKE/iptables-restore"

          "$QEMU" "$SMOKE/iptables" --version | tee iptables-version.txt
          grep -Eq '^iptables v1\.6\.2' iptables-version.txt

          # iptables-save 1.6.2 has no --version/--help option. Validate that
          # argv[0] dispatch reached iptables_save_main() without touching the
          # host firewall by giving it a deliberately invalid long option.
          set +e
          save_probe=$("$QEMU" "$SMOKE/iptables-save" --ds-invalid-probe 2>&1)
          save_rc=$?
          set -e
          [ "$save_rc" -ne 0 ]
          printf '%s\n' "$save_probe" | grep -Fq 'iptables-save.8'

          "$QEMU" "$SMOKE/iptables-restore" --version | grep -Eq '^iptables-restore v1\.6\.2'
          "$QEMU" "$SMOKE/iptables" -m addrtype -h >/dev/null
          "$QEMU" "$SMOKE/iptables" -m state -h >/dev/null
          "$QEMU" "$SMOKE/iptables" -t nat -j DNAT -h >/dev/null
          "$QEMU" "$SMOKE/iptables" -t nat -j MASQUERADE -h >/dev/null
          "$QEMU" "$SMOKE/iptables" -t mangle -j TCPMSS -h >/dev/null

          "$QEMU" recovery-wifi/out/busybox.ds --list > busybox-applets.txt
          for applet in awk cat chmod chown cp grep ifconfig ip mkdir mount mv ping \
                        readlink rm sed sha256sum sleep sync tail tee udhcpc udhcpd umount \
                        date ntpd timeout nslookup; do
            grep -qx "$applet" busybox-applets.txt || {
              echo "BusyBox recovery binary is missing required applet: $applet"
              exit 1
            }
          done

      - name: Stage RCTools networking in kernel internal initramfs
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/kernel/recovery-initramfs"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/sbin" "$ROOT/sbin/virgl/lib" "$ROOT/lib/firmware/wlan/prima"

          install -m 0755 recovery-wifi/out/rctools-net "$ROOT/sbin/rctools-net"
          test ! -e "$ROOT/sbin/wifi"
          install -m 0755 recovery-wifi/rctools "$ROOT/sbin/rctools"
          install -m 0755 recovery-wifi/out/busybox.ds "$ROOT/sbin/busybox.ds"
          install -m 0755 recovery-wifi/out/iptables.ds "$ROOT/sbin/iptables.ds"
          ln -s iptables.ds "$ROOT/sbin/iptables"
          ln -s iptables.ds "$ROOT/sbin/iptables-save"
          ln -s iptables.ds "$ROOT/sbin/iptables-restore"
          install -m 0755 recovery-wifi/out/wpa_supplicant.ds "$ROOT/sbin/wpa_supplicant.ds"
          install -m 0755 recovery-wifi/out/hostapd.ds "$ROOT/sbin/hostapd.ds"
          install -m 0755 recovery-wifi/out/iw.ds "$ROOT/sbin/iw.ds"
          install -m 0755 recovery-wifi/out/wpa_cli.ds "$ROOT/sbin/wpa_cli.ds"
          install -m 0755 recovery-wifi/out/wpa_passphrase.ds "$ROOT/sbin/wpa_passphrase.ds"
          install -m 0755 recovery-wifi/out/wifi-udhcpc.script "$ROOT/sbin/wifi-udhcpc.script"
          install -m 0755 recovery-wifi/out/wcnss-recovery "$ROOT/sbin/wcnss-recovery"
          install -m 0755 recovery-wifi/out/recovery-time-sync "$ROOT/sbin/recovery-time-sync"
          install -m 0755 recovery-wifi/rctools-gpu "$ROOT/sbin/rctools-gpu"
          install -m 0644 recovery-wifi/out/libsync.so "$ROOT/sbin/libsync.so"
          install -m 0644 recovery-wifi/out/rctools-gpu-probe.so "$ROOT/sbin/rctools-gpu-probe.so"
          install -m 0644 recovery-wifi/out/rctools-opencl-probe.so "$ROOT/sbin/rctools-opencl-probe.so"
          install -m 0644 recovery-wifi/out/rctools-gralloc-probe.so "$ROOT/sbin/rctools-gralloc-probe.so"
          install -m 0644 recovery-wifi/out/android.hardware.graphics.common@1.0.so "$ROOT/sbin/android.hardware.graphics.common@1.0.so"
          install -m 0644 recovery-wifi/out/android.hardware.graphics.common@1.1.so "$ROOT/sbin/android.hardware.graphics.common@1.1.so"
          install -m 0755 recovery-wifi/out/virgl/bin/virgl_test_server "$ROOT/sbin/virgl/virgl_test_server"
          cp -a recovery-wifi/out/virgl/lib/. "$ROOT/sbin/virgl/lib/"
          find "$ROOT/sbin/virgl/lib" -type f -exec chmod 0644 {} +
          ln -sf /mnt/vendor/lib64/egl/libEGL_adreno.so "$ROOT/sbin/virgl/lib/libEGL.so"
          ln -sf /mnt/vendor/lib64/egl/libEGL_adreno.so "$ROOT/sbin/virgl/lib/libEGL.so.1"
          ln -sf /mnt/vendor/lib64/egl/libGLESv2_adreno.so "$ROOT/sbin/virgl/lib/libGLESv2.so"
          ln -sf /mnt/vendor/lib64/egl/libGLESv2_adreno.so "$ROOT/sbin/virgl/lib/libGLESv2.so.2"
          install -m 0755 recovery-wifi/ds-recovery-check "$ROOT/sbin/ds-recovery-check"
          install -m 0644 recovery-wifi/out/WCNSS_qcom_cfg.ini \
            "$ROOT/lib/firmware/wlan/prima/WCNSS_qcom_cfg.ini"

          # GitHub-hosted runners create the staged files as the runner user.
          # The directory-source initramfs generator preserves those numeric
          # IDs unless explicitly remapped, so normalize the payload itself.
          sudo chown -R 0:0 "$ROOT"
          find "$ROOT" -printf '%u:%g %m %P\n' | sort | tee wifi-initramfs-ownership.txt
          if find "$ROOT" \! -user 0 -o \! -group 0 | grep -q .; then
            echo "Non-root ownership remains in internal initramfs staging"
            exit 1
          fi

          cat > wifi-initramfs.fragment <<EOF
          CONFIG_INITRAMFS_SOURCE="$ROOT"
          CONFIG_INITRAMFS_ROOT_UID=0
          CONFIG_INITRAMFS_ROOT_GID=0
          EOF

          find "$ROOT" -type f -printf '%P %s bytes\n' | sort
          cat wifi-initramfs.fragment

          # Keep every original RD_* decompressor enabled, but force only the
          # kernel's built-in initramfs archive to LZMA. This must be inserted
          # before AFLAGS/prerequisite expansion in usr/Makefile; appending it
          # at EOF would be too late for target names already parsed by make.
          python3 <<'PY'
          from pathlib import Path

          p = Path("kernel/usr/Makefile")
          lines = p.read_text().splitlines(keepends=True)
          anchor = [
              i for i, line in enumerate(lines)
              if line.lstrip().startswith("suffix_$(CONFIG_RD_GZIP)")
              and ".gz" in line
          ]
          if len(anchor) != 1:
              raise SystemExit(
                  f"expected one CONFIG_RD_GZIP suffix line, found {len(anchor)}"
              )
          i = anchor[0] + 1
          lines[i:i] = [
              "\n",
              "# Recovery Wi-Fi: compact built-in initramfs without changing RD_* support.\n",
              "suffix_y := .lzma\n",
          ]
          p.write_text("".join(lines))
          PY
          grep -n -A5 -B2 'Recovery Wi-Fi: compact' kernel/usr/Makefile

          # usr/Makefile creates initramfs_data.cpio.lzma through
          # scripts/gen_initramfs_list.sh, not scripts/Makefile.lib. Patch the
          # compressor that is actually used for the built-in initramfs.
          # TeamWin's external recovery ramdisk uses an 8 MiB LZMA dictionary;
          # keep the internal Wi-Fi archive in the same early-boot memory class.
          python3 <<'PY'
          from pathlib import Path

          p = Path("kernel/scripts/gen_initramfs_list.sh")
          s = p.read_text()
          old = 'compr="lzma -9 -f"'
          new = 'compr="lzma -9 -f --lzma1=dict=8MiB"'
          if s.count(old) != 1:
              raise SystemExit(
                  f"expected one initramfs LZMA compressor, found {s.count(old)}"
              )
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n -A3 -B2 'compr="lzma' kernel/scripts/gen_initramfs_list.sh

