name: Dispatch all Channel kernels (temporary)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-all-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the twelve Channel build workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          ref = os.environ['GITHUB_REF_NAME']
          expected_sha = os.environ['GITHUB_SHA']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version': '2026-03-10',
              'Content-Type': 'application/json',
          }

          def api(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=body, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = response.read()
                  return json.loads(content) if content else {}

          head = api('/git/ref/heads/' + ref)['object']['sha']
          if head != expected_sha:
              raise SystemExit(f'Ref moved: expected {expected_sha}, found {head}')

          failures = []
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Build source: `{expected_sha}`\n\n')
              for branch in ['17.1', '18.1', '22.2']:
                  for suffix in ['', '-optional', '-ksu-only', '-remove-ksu']:
                      workflow = f'build-{branch}{suffix}.yml'
                      try:
                          result = api(f'/actions/workflows/{workflow}/dispatches', {'ref': ref})
                          print(json.dumps({'workflow': workflow, 'status': 'dispatched', **result}), flush=True)
                          summary.write(f'- Dispatched `{workflow}`\n')
                          summary.flush()
                      except (urllib.error.URLError, TimeoutError) as error:
                          failures.append(workflow)
                          print(f'Failed to dispatch {workflow}: {error}', flush=True)
                          summary.write(f'- FAILED `{workflow}`: {error}\n')
                          summary.flush()
          if failures:
              raise SystemExit('Dispatch failed for: ' + ', '.join(failures))
          PY
