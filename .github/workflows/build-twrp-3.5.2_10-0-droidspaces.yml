name: Build Channel TWRP 3.5.2 DroidSpaces

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TWRP_KERNEL_REPO: https://github.com/SyberHexen/android_kernel_motorola_sdm632.git
  TWRP_KERNEL_REF: 6f90eaecaa8525282c23edc398b404ec01c815eb
  TWRP_BASE_URL: https://dl.twrp.me/channel/twrp-3.5.2_10-0-channel.img
  TWRP_BASE_SHA256: 486c3e11250c1233112372129c796b55e0cd5d0f4ac605906d90b0f9b574056c
  OUTPUT_IMG: channel-twrp-3.5.2_10-0-droidspaces.img

jobs:
  build:
    name: TWRP 3.5.2 + DroidSpaces kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget ca-certificates \
            bc bison flex libssl-dev libelf-dev make libncurses-dev \
            python3 xz-utils cpio zip

      - name: Clone exact TWRP channel kernel base
        run: |
          git init kernel
          git -C kernel remote add origin "$TWRP_KERNEL_REPO"
          git -C kernel fetch --depth=1 origin "$TWRP_KERNEL_REF"
          git -C kernel checkout --detach FETCH_HEAD

          echo "TWRP kernel base:" >> "$GITHUB_STEP_SUMMARY"
          git -C kernel log -1 --format='- %H %s' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply DroidSpaces cgroup noprefix fix
        run: |
          # SaaSD3v/android_kernel_motorola_sdm632:
          # c6f0507da463 - fix: cgroups noprefix
          curl -fL --retry 5 \
            "https://github.com/SaaSD3v/android_kernel_motorola_sdm632/commit/c6f0507da463.patch" \
            -o /tmp/droidspaces-cgroup-noprefix.patch

          git -C kernel apply --check /tmp/droidspaces-cgroup-noprefix.patch
          git -C kernel apply /tmp/droidspaces-cgroup-noprefix.patch

      - name: Create DroidSpaces Kconfig fragment
        run: |
          # This fragment carries the configuration changes from:
          # ee9637adaa0c - Kernel configurations for full DroidSpaces support
          # e310252413ff - Firewall Support (UFW/Fail2ban) - Optional
          # f09c342d80aa - disable CONFIG_ANDROID_PARANOID_NETWORK
          #
          # The source-code fix c6f0507da463 is applied separately above.
          cat > droidspaces.fragment <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_MEMCG=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_VETH=y
          CONFIG_OVERLAY_FS=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF

          cat droidspaces.fragment

      - name: Download AOSP Clang r353983c1
        run: |
          curl -fL --retry 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-qpr3-release/clang-r353983c1.tar.gz" \
            -o clang-r353983c1.tar.gz

          mkdir -p toolchains/clang-r353983c1
          tar -xzf clang-r353983c1.tar.gz -C toolchains/clang-r353983c1
          echo "CLANG_BIN=$GITHUB_WORKSPACE/toolchains/clang-r353983c1/bin" >> "$GITHUB_ENV"

      - name: Download GCC 4.9 AArch64
        run: |
          git clone --depth=1 -b android11-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc-aarch64-4.9
          echo "GCC64_BIN=$GITHUB_WORKSPACE/toolchains/gcc-aarch64-4.9/bin" >> "$GITHUB_ENV"

      - name: Download GCC 4.9 ARM32
        run: |
          git clone --depth=1 -b android11-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchains/gcc-arm-4.9
          echo "GCC32_BIN=$GITHUB_WORKSPACE/toolchains/gcc-arm-4.9/bin" >> "$GITHUB_ENV"

      - name: Configure TWRP kernel
        run: |
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"

          make -C kernel \
            O="$GITHUB_WORKSPACE/build" \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            channel_defconfig

      - name: Merge DroidSpaces fragment
        run: |
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"

          chmod +x kernel/scripts/kconfig/merge_config.sh
          cd kernel

          scripts/kconfig/merge_config.sh -m \
            -O "$GITHUB_WORKSPACE/build" \
            "$GITHUB_WORKSPACE/build/.config" \
            "$GITHUB_WORKSPACE/droidspaces.fragment"

          make \
            O="$GITHUB_WORKSPACE/build" \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

      - name: Verify DroidSpaces configuration
        run: |
          set -e
          CONFIG="$GITHUB_WORKSPACE/build/.config"

          for symbol in \
            CONFIG_SYSVIPC \
            CONFIG_POSIX_MQUEUE \
            CONFIG_CGROUP_PIDS \
            CONFIG_CGROUP_DEVICE \
            CONFIG_MEMCG \
            CONFIG_UTS_NS \
            CONFIG_USER_NS \
            CONFIG_PID_NS \
            CONFIG_IPC_NS \
            CONFIG_BRIDGE_NETFILTER \
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
            CONFIG_CGROUP_NET_PRIO \
            CONFIG_DEVTMPFS \
            CONFIG_VETH \
            CONFIG_OVERLAY_FS \
            CONFIG_IP_SET \
            CONFIG_IP_SET_HASH_IP \
            CONFIG_IP_SET_HASH_NET \
            CONFIG_NETFILTER_XT_SET \
            CONFIG_NETFILTER_XT_MATCH_RECENT
          do
            grep -qx "${symbol}=y" "$CONFIG" || {
              echo "Missing required setting: ${symbol}=y"
              exit 1
            }
          done

          grep -qx '# CONFIG_ANDROID_PARANOID_NETWORK is not set' "$CONFIG"

          grep -E \
            '^(CONFIG_(SYSVIPC|POSIX_MQUEUE|CGROUP_PIDS|CGROUP_DEVICE|MEMCG|UTS_NS|USER_NS|PID_NS|IPC_NS|BRIDGE_NETFILTER|NETFILTER_XT_MATCH_ADDRTYPE|CGROUP_NET_PRIO|DEVTMPFS|VETH|OVERLAY_FS|IP_SET|IP_SET_HASH_IP|IP_SET_HASH_NET|NETFILTER_XT_SET|NETFILTER_XT_MATCH_RECENT)=y|# CONFIG_ANDROID_PARANOID_NETWORK is not set)$' \
            "$CONFIG" | tee droidspaces-final-config.txt

      - name: Build Image.gz-dtb
        run: |
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"

          make -C kernel \
            O="$GITHUB_WORKSPACE/build" \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            -j"$(nproc)" \
            Image.gz-dtb

          test -s build/arch/arm64/boot/Image.gz-dtb
          sha256sum build/arch/arm64/boot/Image.gz-dtb | tee kernel.sha256

      - name: Download exact TWRP 3.5.2_10-0 base image
        run: |
          curl -fL --retry 5 --retry-all-errors \
            -A "Mozilla/5.0" \
            "$TWRP_BASE_URL" \
            -o twrp-base.img

          echo "$TWRP_BASE_SHA256  twrp-base.img" | sha256sum -c -
          test "$(head -c 8 twrp-base.img)" = "ANDROID!"

      - name: Replace only kernel in TWRP base image
        run: |
          python3 <<'PY'
          from pathlib import Path
          import struct

          BASE = Path("twrp-base.img")
          NEW_KERNEL = Path("build/arch/arm64/boot/Image.gz-dtb")
          OUTPUT = Path("${{ env.OUTPUT_IMG }}")

          base = BASE.read_bytes()
          new_kernel = NEW_KERNEL.read_bytes()

          if base[:8] != b"ANDROID!":
              raise SystemExit("Base TWRP image is not an Android boot image")

          kernel_size = struct.unpack_from("<I", base, 8)[0]
          ramdisk_size = struct.unpack_from("<I", base, 16)[0]
          second_size = struct.unpack_from("<I", base, 24)[0]
          page_size = struct.unpack_from("<I", base, 36)[0]
          header_version = struct.unpack_from("<I", base, 40)[0]

          if header_version != 1:
              raise SystemExit(f"Expected boot header v1, got v{header_version}")

          recovery_dtbo_size = struct.unpack_from("<I", base, 1632)[0]
          recovery_dtbo_offset = struct.unpack_from("<Q", base, 1636)[0]
          header_size = struct.unpack_from("<I", base, 1644)[0]

          if header_size != 1648:
              raise SystemExit(f"Unexpected boot header size: {header_size}")

          def align(value, alignment):
              return (value + alignment - 1) // alignment * alignment

          old_kernel_offset = page_size
          old_ramdisk_offset = align(old_kernel_offset + kernel_size, page_size)
          old_second_offset = align(old_ramdisk_offset + ramdisk_size, page_size)
          expected_recovery_offset = align(old_second_offset + second_size, page_size)

          if recovery_dtbo_size and recovery_dtbo_offset != expected_recovery_offset:
              raise SystemExit(
                  f"Unexpected recovery_dtbo offset: header={recovery_dtbo_offset}, "
                  f"calculated={expected_recovery_offset}"
              )

          old_kernel = base[old_kernel_offset:old_kernel_offset + kernel_size]
          ramdisk = base[old_ramdisk_offset:old_ramdisk_offset + ramdisk_size]
          second = base[old_second_offset:old_second_offset + second_size]
          recovery_dtbo = base[
              recovery_dtbo_offset:recovery_dtbo_offset + recovery_dtbo_size
          ]
          tail = base[recovery_dtbo_offset + recovery_dtbo_size:]

          for name, padding in (
              ("kernel", base[old_kernel_offset + kernel_size:old_ramdisk_offset]),
              ("ramdisk", base[old_ramdisk_offset + ramdisk_size:old_second_offset]),
              ("second", base[old_second_offset + second_size:expected_recovery_offset]),
          ):
              if any(padding):
                  raise SystemExit(f"Non-zero {name} padding in base image")

          def build(kernel):
              header = bytearray(base[:page_size])
              struct.pack_into("<I", header, 8, len(kernel))

              new_ramdisk_offset = align(page_size + len(kernel), page_size)
              new_second_offset = align(new_ramdisk_offset + ramdisk_size, page_size)
              new_recovery_offset = align(new_second_offset + second_size, page_size)

              if recovery_dtbo_size:
                  struct.pack_into("<Q", header, 1636, new_recovery_offset)

              out = bytearray(header)
              out += kernel
              out += bytes(new_ramdisk_offset - len(out))
              out += ramdisk
              out += bytes(new_second_offset - len(out))
              out += second
              out += bytes(new_recovery_offset - len(out))
              out += recovery_dtbo
              out += tail
              return bytes(out)

          clone = build(old_kernel)
          if clone != base:
              raise SystemExit("Base-image reconstruction check failed")

          output = build(new_kernel)

          if len(output) > 33554432:
              raise SystemExit(
                  f"Output is {len(output)} bytes, larger than the 32 MiB boot partition"
              )

          OUTPUT.write_bytes(output)

          print(f"Base kernel size : {kernel_size}")
          print(f"New kernel size  : {len(new_kernel)}")
          print(f"Ramdisk size     : {ramdisk_size}")
          print(f"Recovery DTBO    : {recovery_dtbo_size}")
          print(f"Output size      : {len(output)}")
          print(f"Output           : {OUTPUT}")
          PY

      - name: Verify final TWRP image
        run: |
          test "$(head -c 8 "$OUTPUT_IMG")" = "ANDROID!"
          test "$(stat -c%s "$OUTPUT_IMG")" -le 33554432

          sha256sum "$OUTPUT_IMG" | tee twrp-droidspaces.sha256

          {
            echo "### Channel TWRP DroidSpaces build"
            echo
            echo "- TWRP base: 3.5.2_10-0 official channel image"
            echo "- TWRP kernel source: $TWRP_KERNEL_REF"
            echo "- DroidSpaces config commits: ee9637adaa0c, e310252413ff, f09c342d80aa"
            echo "- DroidSpaces source fix: c6f0507da463"
            echo "- KernelSU/ReSukiSU: not added"
            echo
            echo "SHA-256:"
            cat twrp-droidspaces.sha256
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: channel-twrp-3.5.2_10-0-droidspaces
          path: |
            ${{ env.OUTPUT_IMG }}
            build/arch/arm64/boot/Image.gz-dtb
            droidspaces.fragment
            droidspaces-final-config.txt
            kernel.sha256
            twrp-droidspaces.sha256
          if-no-files-found: error
