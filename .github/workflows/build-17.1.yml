name: Build Channel Kernel 17.1

run-name: Channel 17.1 • ${{ inputs.variant }}

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Kernel variant
        required: true
        default: NORMAL
        type: choice
        options:
          - NORMAL
          - OPTIONAL
          - KSU-ONLY
          - REMOVE-KSU

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VARIANT: ${{ inputs.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve variant
        run: |
          set -e
          case "$VARIANT" in
            NORMAL)
              SUFFIX=""
              DESCRIPTION="DroidSpaces + optional configs + ReSukiSU"
              ;;
            OPTIONAL)
              SUFFIX="-optional"
              DESCRIPTION="DroidSpaces + ReSukiSU, optional configs removed"
              ;;
            KSU-ONLY)
              SUFFIX="-ksu-only"
              DESCRIPTION="stock kernel baseline + ReSukiSU only"
              ;;
            REMOVE-KSU)
              SUFFIX="-remove-ksu"
              DESCRIPTION="DroidSpaces + optional configs, without ReSukiSU"
              ;;
            *)
              echo "Unsupported variant: $VARIANT" >&2
              exit 1
              ;;
          esac

          echo "KERNEL_ZIP=channel-kernel-17.1${SUFFIX}.zip" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=channel-kernel-17.1${SUFFIX}" >> "$GITHUB_ENV"
          {
            echo "### Channel kernel 17.1"
            echo
            echo "- Variant: **$VARIANT**"
            echo "- $DESCRIPTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl jq bc bison flex libssl-dev make libncurses-dev zip python3

      - name: Clone kernel source
        run: |
          set -e
          if [ "$VARIANT" = "KSU-ONLY" ]; then
            # KSU-ONLY intentionally starts from the pre-DroidSpaces stock baseline.
            git init kernel
            git -C kernel remote add origin https://github.com/SaaSD3v/android_kernel_motorola_sdm632.git
            git -C kernel fetch --depth=1 origin 39d1dbc72e3d50cb7898aae8b37e6fdaa55c4ca7
            git -C kernel checkout --detach FETCH_HEAD
          else
            git clone --depth=1 -b lineage-17.1 https://github.com/SaaSD3v/android_kernel_motorola_sdm632.git kernel
          fi

          git -C kernel log -1 --format='Kernel base: %H %s' >> "$GITHUB_STEP_SUMMARY"

      - name: Clone ReSukiSU
        if: ${{ inputs.variant != 'REMOVE-KSU' }}
        run: |
          # Fix legacy FBE allowlist saves failing with ENOKEY (-126).
          # https://github.com/ReSukiSU/ReSukiSU/commit/7ad75c5df35781f560f62c5cd6663ba60de56a7c
          RESUKISU_REF=7ad75c5df35781f560f62c5cd6663ba60de56a7c
          git init kernel/KernelSU
          git -C kernel/KernelSU remote add origin https://github.com/ReSukiSU/ReSukiSU.git
          git -C kernel/KernelSU fetch --depth=1 origin "$RESUKISU_REF"
          git -C kernel/KernelSU checkout --detach FETCH_HEAD
          git -C kernel/KernelSU log -1 --format='ReSukiSU: %H %s' >> "$GITHUB_STEP_SUMMARY"

      - name: Download and apply ReSukiSU patch
        if: ${{ inputs.variant != 'REMOVE-KSU' }}
        run: |
          wget -q https://raw.githubusercontent.com/ReSukiSU/ReSukiSU_Patches/b6f202c007475934e0dd5392f0cfddf9b87be81c/scope-minimized/kernel-4.9.patch -O /tmp/ksu.patch
          cd kernel
          git apply /tmp/ksu.patch

      - name: Integrate ReSukiSU into kernel build system
        if: ${{ inputs.variant != 'REMOVE-KSU' }}
        run: |
          cd kernel
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Enable ReSukiSU in defconfig
        if: ${{ inputs.variant != 'REMOVE-KSU' }}
        run: |
          cd kernel
          echo "CONFIG_KSU=y" >> arch/arm64/configs/channel_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/channel_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" >> arch/arm64/configs/channel_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y" >> arch/arm64/configs/channel_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" >> arch/arm64/configs/channel_defconfig

      - name: Remove optional configs
        if: ${{ inputs.variant == 'OPTIONAL' }}
        run: |
          cd kernel
          sed -i '/CONFIG_IP_SET=y/d' arch/arm64/configs/channel_defconfig
          sed -i '/CONFIG_IP_SET_HASH_IP=y/d' arch/arm64/configs/channel_defconfig
          sed -i '/CONFIG_IP_SET_HASH_NET=y/d' arch/arm64/configs/channel_defconfig
          sed -i '/CONFIG_NETFILTER_XT_SET=y/d' arch/arm64/configs/channel_defconfig
          sed -i '/CONFIG_NETFILTER_XT_MATCH_RECENT=y/d' arch/arm64/configs/channel_defconfig
          sed -i '/# CONFIG_IP_SET is not set/d' arch/arm64/configs/channel_defconfig
          sed -i '/# CONFIG_IP_VS is not set/d' arch/arm64/configs/channel_defconfig
          echo "# CONFIG_IP_SET is not set" >> arch/arm64/configs/channel_defconfig
          echo "# CONFIG_IP_VS is not set" >> arch/arm64/configs/channel_defconfig

      - name: Disable Android paranoid network
        if: ${{ inputs.variant != 'KSU-ONLY' }}
        run: |
          cd kernel
          sed -i 's/^CONFIG_ANDROID_PARANOID_NETWORK=y$/# CONFIG_ANDROID_PARANOID_NETWORK is not set/' arch/arm64/configs/channel_defconfig

      - name: Download AOSP Clang clang-r365631c
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r365631c.tar.gz
          mkdir -p toolchains/clang-host-linux-x86
          tar -xzf clang-r365631c.tar.gz -C toolchains/clang-host-linux-x86
          echo "CLANG_BIN=${PWD}/toolchains/clang-host-linux-x86/bin" >> "$GITHUB_ENV"

      - name: Download GCC 4.9 AArch64
        run: |
          git clone --depth=1 -b android11-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchains/gcc-aarch64-4.9
          echo "GCC64_BIN=${PWD}/toolchains/gcc-aarch64-4.9/bin" >> "$GITHUB_ENV"

      - name: Download GCC 4.9 ARM32
        run: |
          git clone --depth=1 -b android11-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchains/arm-linux-androideabi-4.9
          echo "GCC32_BIN=${PWD}/toolchains/arm-linux-androideabi-4.9/bin" >> "$GITHUB_ENV"

      - name: Configure kernel
        run: |
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PWD/kernel/scripts:$PATH"
          make -C kernel O=$PWD/build ARCH=arm64 CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 channel_defconfig

      - name: Build kernel
        run: |
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PWD/kernel/scripts:$PATH"
          make -C kernel O=$PWD/build ARCH=arm64 CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j$(nproc) Image.gz-dtb

      - name: Package with AnyKernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp build/arch/arm64/boot/Image.gz-dtb anykernel/
          cp anykernel.sh anykernel/
          cd anykernel
          zip -r9 "../$KERNEL_ZIP" * -x '*.git*'

      - name: Upload to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          SERVER=$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          RESPONSE=$(curl -fsSL -X POST "https://${SERVER}.gofile.io/contents/uploadfile" \
            -H "Authorization: Bearer ${GOFILE_TOKEN}" \
            -F "file=@${KERNEL_ZIP}")
          echo "$RESPONSE" | jq .
          DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
          test -n "$DOWNLOAD_PAGE" && test "$DOWNLOAD_PAGE" != "null"
          echo "GoFile link: $DOWNLOAD_PAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.KERNEL_ZIP }}
