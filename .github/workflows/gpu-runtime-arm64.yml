name: GPU Runtime ARM64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-cli-minimal-gpu-audit
    paths:
      - 'recovery-wifi/build-mesa-kgsl-channel.sh'
      - 'recovery-wifi/build-virtualgl-kgsl.sh'
      - 'recovery-wifi/patches/mesa-kgsl-channel-compat.patch'
      - 'recovery-wifi/patches/virtualgl-eglkgsl.patch'
      - 'recovery-wifi/patches/virtualgl-kgsl-pack-invert.experimental.patch'
      - 'recovery-wifi/patches/virtualgl-kgsl-async-xshm.experimental.patch'
      - '.github/workflows/gpu-runtime-arm64.yml'

jobs:
  mesa-channel-kgsl:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: debian:trixie-slim
      options: --privileged --user root

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Install Mesa build dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/'             /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y mesa
          apt-get install -y git ccache libxfixes-dev libarchive-dev

      - name: Build patched Mesa KGSL
        shell: bash
        run: |
          set -euo pipefail
          chmod +x recovery-wifi/build-mesa-kgsl-channel.sh
          JOBS=2 recovery-wifi/build-mesa-kgsl-channel.sh

      - name: Upload Mesa runtime
        uses: actions/upload-artifact@v7
        with:
          name: mesa-channel-kgsl-debian-trixie-arm64
          path: recovery-wifi/out/mesa-kgsl-channel/*
          retention-days: 90

  virtualgl-kgsl:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: debian:trixie-slim
      options: --privileged --user root

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            pack_invert: '0'
            async_xshm: '0'
          - variant: pack-invert-experimental
            pack_invert: '1'
            async_xshm: '0'
          - variant: pack-invert-async-xshm-experimental
            pack_invert: '1'
            async_xshm: '1'

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Install VirtualGL build dependencies
        run: |
          apt-get update
          apt-get install -y             git cmake ninja-build g++ binutils             libturbojpeg0-dev             libx11-dev libxext-dev libxtst-dev             libgl-dev libglu1-mesa-dev libegl-dev             libxcb1-dev libxcb-keysyms1-dev             libxcb-glx0-dev libx11-xcb-dev

      - name: Build VirtualGL KGSL
        shell: bash
        run: |
          set -euo pipefail
          chmod +x recovery-wifi/build-virtualgl-kgsl.sh
          PREFIX=/opt/VirtualGL-KGSL           INSTALL=1           PACK_INVERT=${{ matrix.pack_invert }}           ASYNC_XSHM=${{ matrix.async_xshm }}           JOBS=2             recovery-wifi/build-virtualgl-kgsl.sh

          mkdir -p recovery-wifi/out/virtualgl-kgsl
          archive="recovery-wifi/out/virtualgl-kgsl/VirtualGL-KGSL-${{ matrix.variant }}-arm64.tar.gz"
          tar -zcf "$archive" -C / opt/VirtualGL-KGSL
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload VirtualGL runtime
        uses: actions/upload-artifact@v7
        with:
          name: virtualgl-kgsl-${{ matrix.variant }}-arm64
          path: recovery-wifi/out/virtualgl-kgsl/*
          retention-days: 90


  bundle:
    needs:
      - mesa-channel-kgsl
      - virtualgl-kgsl
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download Mesa runtime
        uses: actions/download-artifact@v8
        with:
          name: mesa-channel-kgsl-debian-trixie-arm64
          path: bundle/mesa

      - name: Download VirtualGL stable
        uses: actions/download-artifact@v8
        with:
          name: virtualgl-kgsl-stable-arm64
          path: bundle/virtualgl-stable

      - name: Download VirtualGL pack-invert
        uses: actions/download-artifact@v8
        with:
          name: virtualgl-kgsl-pack-invert-experimental-arm64
          path: bundle/virtualgl-pack-invert

      - name: Download VirtualGL async-XShm
        uses: actions/download-artifact@v8
        with:
          name: virtualgl-kgsl-pack-invert-async-xshm-experimental-arm64
          path: bundle/virtualgl-async-xshm

      - name: Assemble reproducible test bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT=channel-gpu-runtime-arm64
          rm -rf "$OUT"
          mkdir -p "$OUT"

          find bundle -type f -name '*.tar.gz' -exec cp -v {} "$OUT/" \;

          test "$(find "$OUT" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 4

          (
            cd "$OUT"
            sha256sum ./*.tar.gz | sort -k2 > SHA256SUMS
          )

          cat >"$OUT/MANIFEST.txt" <<EOF
          project=SaaSD3v/channel-kernel-build
          branch=${GITHUB_REF_NAME}
          project_commit=${GITHUB_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_number=${GITHUB_RUN_NUMBER}
          architecture=arm64
          mesa_base=98f3d6229d61452cef80f8563af7c56ae599dc14
          virtualgl_base=2473cf39bdbe88ca41ecd58ac4007385c9682a9f

          VirtualGL variants:
          A stable: pack_invert=0 async_xshm=0
          B pack-invert: pack_invert=1 async_xshm=0
          C pack-invert + async-XShm: pack_invert=1 async_xshm=1

          Device validation order: A -> B -> C.
          CI/source success is not a real-device validation result.
          EOF

          cat "$OUT/MANIFEST.txt"
          cat "$OUT/SHA256SUMS"

      - name: Upload complete GPU runtime bundle
        uses: actions/upload-artifact@v7
        with:
          name: channel-gpu-runtime-arm64-bundle
          path: channel-gpu-runtime-arm64/*
          retention-days: 90
