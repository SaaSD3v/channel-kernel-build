# Recovery Wi-Fi build profile: Motorola Moto G7 Play (channel)
# This profile describes the portable userspace build. Runtime bring-up remains
# implemented by recovery-wifi/wifi and is currently validated for PRONTO/WCNSS.

DEVICE_CODENAME=channel
DEVICE_NAME="Motorola Moto G7 Play"
DS_WIFI_ARCH=arm64
DS_WIFI_CROSS=aarch64-linux-gnu-
DS_WIFI_HOST=aarch64-linux-gnu
DS_WIFI_OPENSSL_TARGET=linux-aarch64

# Documentation/porting metadata.
DS_WIFI_IFACE=wlan0
DS_WIFI_DRIVER=pronto
DS_WIFI_FIRMWARE=wcnss
DS_WIFI_KERNEL_IMAGE=Image.gz-dtb
DS_WIFI_BOOT_HEADER=1
